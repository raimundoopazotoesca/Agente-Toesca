<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toesca Real Estate AI Analyst</title>
<style>
  :root{
    --ink:#0f172a; --ink-soft:#334155; --muted:#64748b; --muted-soft:#94a3b8;
    --border:#e6e9ef; --bg:#f7f8fa; --surface:#ffffff; --sidebar-bg:#0b1220;
    --radius-lg:16px; --radius-md:10px;
    --shadow-md:0 20px 45px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

  .login-wrap{width:min(392px,calc(100vw - 40px));display:flex;flex-direction:column;align-items:center;
    animation:card-enter .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes card-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){.login-wrap{animation:none}}

  .brand-plate{width:76px;height:76px;border-radius:16px;background:var(--sidebar-bg);display:grid;
    place-items:center;box-shadow:0 14px 28px rgba(15,23,42,.16);margin-bottom:22px}
  .brand-plate img{display:block;width:52px;height:auto}

  .card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);padding:38px 34px 32px;text-align:center}
  h1{font-size:21px;line-height:1.25;letter-spacing:-.3px;margin:0 0 8px;font-weight:600;color:var(--ink)}
  .subtitle{color:var(--muted);font-size:13.5px;margin:0 0 30px;line-height:1.5}

  form{text-align:left}
  label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);display:block;margin:0 0 6px}
  .field + .field{margin-top:16px}
  input{box-sizing:border-box;width:100%;padding:11px 13px;border-radius:var(--radius-md);
    border:1px solid var(--border);font:inherit;font-size:14px;color:var(--ink);
    background:var(--surface);transition:border-color .15s ease,box-shadow .15s ease}
  input::placeholder{color:var(--muted-soft)}
  input:focus{outline:none;border-color:var(--ink-soft);box-shadow:0 0 0 3px rgba(15,23,42,.08)}

  button{margin-top:24px;width:100%;border:0;border-radius:var(--radius-md);background:var(--ink);
    color:#fff;font:inherit;font-size:14px;font-weight:600;padding:12px;cursor:pointer;
    transition:opacity .15s ease,transform .15s ease}
  button:hover:not(:disabled){opacity:.92}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed}

  .error{color:#b91c1c;font-size:12.5px;min-height:18px;margin-top:12px;text-align:center}

  /* ── Post-login transition (historical choreography, compressed) ── */
  #toesca-login-loader{position:fixed;inset:0;background:#0a0a0a;z-index:99999;
    display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .25s ease}
  #toesca-login-loader.leaving{opacity:0}
  .tl-content{display:flex;align-items:baseline;line-height:1;
    font-family:Georgia,'Times New Roman',serif;font-size:4.4rem;color:#e8e3dc}
  .tl-text{opacity:0}
  .tl-dot{display:inline-block;opacity:0}
  #toesca-login-loader.in .tl-text{animation:tl-textin .2s ease-out forwards}
  #toesca-login-loader.in .tl-dot{animation:tl-dotin .35s cubic-bezier(0.34,1.45,0.64,1) .1s forwards}
  @keyframes tl-textin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes tl-dotin{0%{opacity:0;transform:translateX(-40vw)}12%{opacity:1}100%{opacity:1;transform:translateX(0)}}
  #toesca-login-loader.reduced .tl-text,#toesca-login-loader.reduced .tl-dot{opacity:1;animation:none;transform:none}
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand-plate"><img src="/assets/toesca_logo_white.png" alt="Toesca"></div>
    <div class="card">
      <h1>Toesca Real Estate AI Analyst</h1>
      <p class="subtitle">Inicia sesión para acceder a tu espacio privado.</p>
      <form id="login">
        <div class="field">
          <label for="username">Correo o usuario</label>
          <input id="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Entrar</button>
        <div class="error" id="error"></div>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('login');
    const errorEl = document.getElementById('error');
    const submitBtn = form.querySelector('button');

    function createLoader() {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const overlay = document.createElement('div');
      overlay.id = 'toesca-login-loader';
      overlay.setAttribute('role', 'status');
      overlay.setAttribute('aria-label', 'Cargando Toesca Real Estate AI Analyst');
      overlay.innerHTML = '<div class="tl-content"><span class="tl-text">toesca</span><span class="tl-dot">.</span></div>';
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add(reduced ? 'reduced' : 'in'));
      return { overlay, minVisibleMs: reduced ? 300 : 750 };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      // La transición se muestra de inmediato (feedback de carga estándar); si el
      // login falla, se retira sin haber navegado ni completado la animación de éxito.
      const { overlay, minVisibleMs } = createLoader();
      const start = performance.now();
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username.value, password: password.value }),
        });
        if (r.ok) {
          const remaining = Math.max(0, minVisibleMs - (performance.now() - start));
          setTimeout(() => overlay.classList.add('leaving'), remaining);
          setTimeout(() => location.assign('/analyst'), remaining + 250);
        } else {
          overlay.remove();
          errorEl.textContent = 'Usuario o contraseña inválidos.';
          submitBtn.disabled = false;
        }
      } catch (err) {
        overlay.remove();
        errorEl.textContent = 'No se pudo conectar. Intenta nuevamente.';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>

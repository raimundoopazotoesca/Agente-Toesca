<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toesca Real Estate AI Analyst</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#f7f8fa;color:#0f172a}.card{width:min(360px,calc(100vw - 40px));background:white;padding:28px;border:1px solid #e6e9ef;border-radius:14px;box-shadow:0 10px 30px #0f172a12}h1{font-size:20px;margin:0 0 4px}p{color:#64748b;font-size:14px;margin:0 0 22px}label{font-size:13px;font-weight:600;display:block;margin:12px 0 5px}input,button{box-sizing:border-box;width:100%;padding:10px 12px;border-radius:8px;font:inherit}input{border:1px solid #cbd5e1}button{margin-top:18px;border:0;background:#0f172a;color:white;font-weight:600;cursor:pointer}.error{color:#b91c1c;font-size:13px;min-height:19px;margin-top:10px}</style>
<main class="card"><h1>Toesca Real Estate AI Analyst</h1><p>Inicia sesión para acceder a tu espacio privado.</p><form id="login"><label>Usuario</label><input id="username" autocomplete="username" required autofocus><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button><div class="error" id="error"></div></form></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.assign('/analyst');else error.textContent='Usuario o contraseña inválidos.'})</script>
</html>

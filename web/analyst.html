<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toesca Analyst</title>
<style>
  :root{
    --ink:#0f172a; --ink-soft:#334155; --muted:#64748b; --muted-soft:#94a3b8;
    --border:#e6e9ef; --border-soft:#eef1f5; --bg:#f7f8fa; --surface:#ffffff;
    --sidebar-bg:#0b1220; --sidebar-bg-hover:#16213a; --sidebar-active:#182236;
    --sidebar-text:#cbd5e1; --sidebar-text-dim:#7c8aa5; --sidebar-border:rgba(255,255,255,.07);
    --radius-lg:14px; --radius-md:10px; --radius-sm:7px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow-md:0 10px 30px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);background:var(--bg);overflow:hidden;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .shell{display:flex;height:100vh;width:100vw}

  /* ── Sidebar ── */
  .sidebar{width:272px;flex:0 0 auto;background:var(--sidebar-bg);color:var(--sidebar-text);
    display:flex;flex-direction:column;transition:width .16s ease;border-right:1px solid #050a14}
  .sidebar.collapsed{width:0}
  .sidebar-head{padding:20px 18px 14px;display:flex;align-items:center;gap:11px;
    border-bottom:1px solid var(--sidebar-border);margin-bottom:6px}
  .sidebar-mark{width:30px;height:30px;border-radius:7px;background:#181f30;
    border:1px solid rgba(255,255,255,.09);color:#e8e3dc;display:inline-flex;
    align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif;
    font-size:15px;letter-spacing:-.5px;flex:0 0 auto}
  .sidebar-title{font-size:13.5px;font-weight:600;color:#f1f5f9;letter-spacing:.1px}
  .sidebar-sub{font-size:10.5px;color:var(--sidebar-text-dim);margin-top:1px}
  .new-chat-btn{margin:2px 14px 14px;padding:9px 12px;border-radius:var(--radius-sm);
    border:1px solid rgba(255,255,255,.1);background:transparent;color:#e2e8f0;
    font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;
    gap:8px;letter-spacing:.1px;transition:background .12s ease,border-color .12s ease}
  .new-chat-btn:hover{background:var(--sidebar-bg-hover);border-color:rgba(255,255,255,.16)}
  .new-chat-btn .plus{font-size:14px;line-height:1;color:var(--sidebar-text-dim)}
  .conv-section-label{padding:4px 18px 6px;font-size:10px;font-weight:600;letter-spacing:.5px;
    text-transform:uppercase;color:var(--sidebar-text-dim)}
  .conv-list{flex:1;overflow-y:auto;padding:0 8px 12px}
  .conv-item{position:relative;padding:9px 10px 9px 13px;border-radius:var(--radius-sm);
    cursor:pointer;display:flex;flex-direction:column;gap:1px;margin-bottom:1px;
    border-left:2px solid transparent;transition:background .12s ease}
  .conv-item:hover{background:var(--sidebar-bg-hover)}
  .conv-item.active{background:var(--sidebar-active);border-left-color:#8b93a7}
  .conv-item .conv-title{font-size:12.5px;color:#dbe2ee;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;padding-right:22px;font-weight:500}
  .conv-item.active .conv-title{color:#fff}
  .conv-item .conv-meta{font-size:10px;color:var(--sidebar-text-dim)}
  .conv-item .conv-menu-btn{position:absolute;right:5px;top:7px;background:transparent;border:none;
    color:var(--sidebar-text-dim);cursor:pointer;font-size:14px;padding:2px 5px;border-radius:4px;
    display:none;line-height:1}
  .conv-item:hover .conv-menu-btn,.conv-item.active .conv-menu-btn{display:block}
  .conv-menu-btn:hover{background:rgba(255,255,255,.1);color:#fff}
  .conv-menu{position:absolute;right:6px;top:30px;background:#fff;color:var(--ink);
    border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);
    z-index:20;min-width:142px;overflow:hidden}
  .conv-menu button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;
    border:none;font-size:12.5px;cursor:pointer;color:var(--ink-soft)}
  .conv-menu button:hover{background:var(--bg);color:var(--ink)}
  .conv-empty{padding:14px 13px;color:var(--sidebar-text-dim);font-size:12px;line-height:1.55}
  .conv-rename-input{width:100%;font-size:12.5px;padding:3px 6px;border-radius:5px;
    border:1px solid #64748b;background:#050a14;color:#fff;outline:none}

  /* ── Main ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
  .topbar{height:54px;flex:0 0 auto;border-bottom:1px solid var(--border-soft);display:flex;
    align-items:center;gap:12px;padding:0 20px;background:var(--surface)}
  .topbar .collapse-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);
    width:29px;height:29px;cursor:pointer;color:var(--muted);font-size:13px;
    transition:background .12s ease}
  .topbar .collapse-btn:hover{background:var(--bg)}
  .topbar .chat-title{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;letter-spacing:.05px}
  .topbar .chat-sub{font-size:11px;color:var(--muted-soft);margin-top:1px}

  .scroll-area{flex:1;overflow-y:auto;background:var(--surface)}
  .conversation{max-width:720px;margin:0 auto;padding:32px 24px 16px;display:flex;
    flex-direction:column;gap:26px;min-height:100%}
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--muted);text-align:center;gap:7px}
  .empty-state .mark{width:44px;height:44px;border-radius:9px;background:#111;
    border:1px solid #222;color:#e8e3dc;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-size:20px;margin-bottom:6px}
  .empty-state h2{font-size:15.5px;color:var(--ink);margin:0;font-weight:600}
  .empty-state p{font-size:12.5px;max-width:340px;margin:0;color:var(--muted);line-height:1.55}

  .turn{display:flex;flex-direction:column;gap:7px}
  .turn.user{align-items:flex-end}
  .turn-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;
    color:var(--muted-soft);letter-spacing:.15px}
  .turn-label .mark-sm{width:19px;height:19px;border-radius:4px;background:#111;
    color:#e8e3dc;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-size:10px;flex:0 0 auto}

  .prose{font-size:14.5px;line-height:1.68;color:var(--ink-soft);max-width:100%}
  .prose p{margin:0 0 .85em}
  .prose p:last-child{margin-bottom:0}
  .prose h1,.prose h2,.prose h3{margin:1.1em 0 .5em;color:var(--ink);font-weight:600}
  .prose h1{font-size:16.5px}
  .prose h2{font-size:15.5px}
  .prose h3{font-size:14.5px}
  .prose h1:first-child,.prose h2:first-child,.prose h3:first-child{margin-top:0}
  .prose b,.prose strong{color:var(--ink);font-weight:600}
  .prose ul{margin:.5em 0;padding-left:1.3em}
  .prose li{margin:.25em 0}
  .prose table{border-collapse:collapse;margin:.9em 0;font-size:13px;width:100%;
    box-shadow:var(--shadow-sm);border-radius:8px;overflow:hidden}
  .prose th{background:var(--bg);font-weight:600;color:var(--ink);text-align:left;
    font-size:11.5px;letter-spacing:.1px;text-transform:uppercase;color:var(--muted)}
  .prose th,.prose td{border-bottom:1px solid var(--border-soft);padding:7px 11px;text-align:left}
  .prose tr:last-child td{border-bottom:none}
  .prose code{background:var(--bg);padding:1.5px 6px;border-radius:5px;font-size:13px;
    border:1px solid var(--border-soft)}
  .prose pre{background:var(--ink);color:#e2e8f0;padding:13px 15px;border-radius:var(--radius-md);
    overflow-x:auto;font-size:12.5px;line-height:1.55}
  .prose .tc-chart-legend{font-size:11px;color:var(--muted);margin-bottom:4px}
  .prose .tc-chart-legend span{margin-right:10px;white-space:nowrap}
  .prose .tc-chart-wrap{margin:1em 0}

  .user-bubble{max-width:min(560px,84%);padding:10px 15px;border-radius:14px 14px 4px 14px;
    background:var(--ink);color:#fff;font-size:14px;line-height:1.55}

  .thinking{display:flex;align-items:center;gap:9px;color:var(--muted-soft);font-size:12.5px}
  .thinking-dots{display:flex;gap:3.5px}
  .thinking-dots span{width:5px;height:5px;border-radius:50%;background:var(--muted-soft);
    animation:an-bounce 1.1s infinite ease-in-out both}
  .thinking-dots span:nth-child(1){animation-delay:-.24s}
  .thinking-dots span:nth-child(2){animation-delay:-.12s}
  @keyframes an-bounce{0%,80%,100%{transform:scale(.6);opacity:.45}40%{transform:scale(1);opacity:1}}

  .turn-error{color:#b91c1c;font-size:13px;background:#fef2f2;border:1px solid #fecaca;
    border-radius:var(--radius-sm);padding:9px 13px}

  .composer{flex:0 0 auto;background:var(--surface);padding:14px 20px 20px}
  .composer-inner{max-width:720px;margin:0 auto;display:flex;gap:9px;align-items:flex-end;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
    padding:9px 9px 9px 16px;box-shadow:var(--shadow-md);transition:border-color .12s ease}
  .composer-inner:focus-within{border-color:#b7c0cf}
  .composer textarea{flex:1;border:none;padding:8px 0;font-size:14px;resize:none;height:24px;
    max-height:160px;font-family:inherit;outline:none;line-height:1.5;color:var(--ink)}
  .composer textarea::placeholder{color:var(--muted-soft)}
  .composer button{background:var(--ink);color:#fff;border:none;border-radius:var(--radius-md);
    padding:0 16px;height:38px;cursor:pointer;font-size:13px;font-weight:600;
    transition:opacity .12s ease}
  .composer button:disabled{opacity:.4;cursor:not-allowed}
  .composer-hint{max-width:720px;margin:9px auto 0;font-size:10.5px;color:var(--muted-soft);
    text-align:center}

  .banner{padding:8px 20px;font-size:12.5px;background:#fef2f2;color:#b91c1c;
    border-bottom:1px solid #fecaca;display:none}
  .banner.show{display:block}

  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#d7dce3;border-radius:5px;border:2px solid var(--surface)}
  .sidebar ::-webkit-scrollbar-thumb{background:#2a3348;border:2px solid var(--sidebar-bg)}

  @media (max-width: 820px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:30;width:260px;box-shadow:var(--shadow-md)}
    .sidebar.collapsed{width:0;box-shadow:none}
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-mark">t.</span>
        <div>
          <div class="sidebar-title">Toesca Analyst</div>
          <div class="sidebar-sub">Asistente Inmobiliario</div>
        </div>
      </div>
      <button class="new-chat-btn" id="new-chat-btn" type="button">
        <span class="plus">+</span> Nuevo chat
      </button>
      <div class="conv-section-label">Historial</div>
      <div class="conv-list" id="conv-list"></div>
    </aside>
    <main class="main">
      <div class="topbar">
        <button class="collapse-btn" id="collapse-btn" title="Mostrar/ocultar historial">☰</button>
        <div>
          <div class="chat-title" id="chat-title">Toesca Analyst</div>
          <div class="chat-sub" id="chat-sub">Selecciona o crea un chat</div>
        </div>
        <button id="logout-btn" type="button" style="margin-left:auto;border:0;background:none;color:#64748b;cursor:pointer">Salir</button>
      </div>
      <div class="banner" id="error-banner"></div>
      <div class="scroll-area" id="scroll-area">
        <div class="conversation" id="conversation"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="composer-input" placeholder="Escribe tu pregunta…" rows="1"></textarea>
          <button id="composer-send" type="button">Enviar</button>
        </div>
        <div class="composer-hint">El contenido generado por la IA puede ser inexacto.</div>
      </div>
    </main>
  </div>
  <script src="/analyst_workspace.js" defer></script>
</body>
</html>

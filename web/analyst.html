<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toesca Analyst</title>
<style>
  :root{
    --navy:#0f172a; --navy-soft:#1e293b; --border:#e2e8f0; --bg:#f8fafc;
    --text:#0f172a; --muted:#64748b; --accent:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);background:var(--bg);overflow:hidden}
  .shell{display:flex;height:100vh;width:100vw}

  /* ── Sidebar ── */
  .sidebar{width:280px;flex:0 0 auto;background:var(--navy);color:#e2e8f0;
    display:flex;flex-direction:column;transition:width .15s ease,padding .15s ease}
  .sidebar.collapsed{width:0;overflow:hidden}
  .sidebar-head{padding:16px 14px 10px;display:flex;align-items:center;gap:10px}
  .sidebar-mark{width:32px;height:32px;border-radius:4px;background:#111;border:1px solid #222;
    color:#e8e3dc;display:inline-flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-size:16px;letter-spacing:-.5px;flex:0 0 auto}
  .sidebar-title{font-size:14.5px;font-weight:600;color:#fff}
  .sidebar-sub{font-size:11px;color:#94a3b8}
  .new-chat-btn{margin:8px 14px 12px;padding:9px 12px;border-radius:8px;border:1px solid #334155;
    background:#1e293b;color:#e2e8f0;font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;gap:8px}
  .new-chat-btn:hover{background:#243244}
  .conv-list{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .conv-item{position:relative;padding:9px 10px;border-radius:8px;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
  .conv-item:hover{background:#1e293b}
  .conv-item.active{background:#2563eb22;border:1px solid #2563eb55}
  .conv-item .conv-title{font-size:13px;color:#e2e8f0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;padding-right:22px}
  .conv-item .conv-meta{font-size:10.5px;color:#94a3b8}
  .conv-item .conv-menu-btn{position:absolute;right:6px;top:8px;background:transparent;border:none;
    color:#94a3b8;cursor:pointer;font-size:15px;padding:2px 5px;border-radius:4px;display:none}
  .conv-item:hover .conv-menu-btn,.conv-item.active .conv-menu-btn{display:block}
  .conv-menu-btn:hover{background:#334155;color:#fff}
  .conv-menu{position:absolute;right:6px;top:30px;background:#fff;color:#0f172a;
    border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 25px rgba(15,23,42,.25);
    z-index:20;min-width:140px;overflow:hidden}
  .conv-menu button{display:block;width:100%;text-align:left;padding:8px 12px;background:none;
    border:none;font-size:12.5px;cursor:pointer;color:#0f172a}
  .conv-menu button:hover{background:#f1f5f9}
  .conv-empty{padding:16px 12px;color:#94a3b8;font-size:12.5px;line-height:1.5}
  .conv-rename-input{width:100%;font-size:13px;padding:3px 5px;border-radius:5px;
    border:1px solid #2563eb;background:#0b1220;color:#fff}

  /* ── Main ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .topbar{height:56px;flex:0 0 auto;border-bottom:1px solid var(--border);display:flex;
    align-items:center;gap:12px;padding:0 18px;background:#fff}
  .topbar .collapse-btn{background:none;border:1px solid var(--border);border-radius:6px;
    width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:14px}
  .topbar .collapse-btn:hover{background:#f1f5f9}
  .topbar .chat-title{font-size:14.5px;font-weight:600;color:var(--text);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .topbar .chat-sub{font-size:11.5px;color:var(--muted)}

  .scroll-area{flex:1;overflow-y:auto;background:var(--bg)}
  .conversation{max-width:820px;margin:0 auto;padding:24px 20px 12px;display:flex;
    flex-direction:column;gap:16px;min-height:100%}
  .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--muted);text-align:center;gap:6px}
  .empty-state .mark{width:48px;height:48px;border-radius:8px;background:#111;border:1px solid #222;
    color:#e8e3dc;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-size:22px;margin-bottom:8px}
  .empty-state h2{font-size:16px;color:var(--text);margin:0}
  .empty-state p{font-size:13px;max-width:360px;margin:0}

  .row{display:flex;gap:10px;align-items:flex-start}
  .row.user{justify-content:flex-end}
  .mark-sm{width:28px;height:28px;border-radius:4px;background:#111;border:1px solid #222;
    color:#e8e3dc;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,"Times New Roman",serif;font-size:13px;flex:0 0 auto;margin-top:2px}
  .bubble{max-width:min(680px,86%);padding:11px 14px;border-radius:12px;font-size:14px;
    line-height:1.55;word-wrap:break-word}
  .bubble.assistant{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
  .bubble.user{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
  .bubble h1,.bubble h2,.bubble h3{margin:.5em 0;font-size:15px}
  .bubble table{border-collapse:collapse;margin:.5em 0;font-size:13px}
  .bubble th,.bubble td{border:1px solid var(--border);padding:4px 8px;text-align:left}
  .bubble code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12.5px}
  .bubble pre{background:var(--navy);color:#e2e8f0;padding:10px;border-radius:6px;
    overflow-x:auto;font-size:12.5px}
  .bubble .tc-chart-legend{font-size:11px;color:var(--muted);margin-bottom:2px}
  .bubble .tc-chart-legend span{margin-right:8px;white-space:nowrap}
  .typing{color:var(--muted);font-size:13px;font-style:italic;padding-left:38px}
  .turn-error{color:#b91c1c;font-size:13px;padding-left:38px}

  .composer{flex:0 0 auto;border-top:1px solid var(--border);background:#fff;padding:14px 20px 18px}
  .composer-inner{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  .composer textarea{flex:1;border:1px solid #cbd5e1;border-radius:12px;padding:11px 14px;
    font-size:14px;resize:none;height:46px;max-height:160px;font-family:inherit;outline:none}
  .composer textarea:focus{border-color:var(--navy)}
  .composer button{background:var(--navy);color:#fff;border:none;border-radius:10px;
    padding:0 18px;height:46px;cursor:pointer;font-size:13.5px;font-weight:600}
  .composer button:disabled{opacity:.45;cursor:not-allowed}
  .composer-hint{max-width:820px;margin:6px auto 0;font-size:11px;color:#94a3b8}

  .banner{padding:8px 20px;font-size:12.5px;background:#fef2f2;color:#b91c1c;
    border-bottom:1px solid #fecaca;display:none}
  .banner.show{display:block}

  @media (max-width: 820px){
    .sidebar{position:fixed;inset:0 auto 0 0;z-index:30;width:260px}
    .sidebar.collapsed{width:0}
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="sidebar-mark">t.</span>
        <div>
          <div class="sidebar-title">Toesca Analyst</div>
          <div class="sidebar-sub">Asistente Inmobiliario</div>
        </div>
      </div>
      <button class="new-chat-btn" id="new-chat-btn" type="button">+ Nuevo chat</button>
      <div class="conv-list" id="conv-list"></div>
    </aside>
    <main class="main">
      <div class="topbar">
        <button class="collapse-btn" id="collapse-btn" title="Mostrar/ocultar historial">☰</button>
        <div>
          <div class="chat-title" id="chat-title">Toesca Analyst</div>
          <div class="chat-sub" id="chat-sub">Selecciona o crea un chat</div>
        </div>
      </div>
      <div class="banner" id="error-banner"></div>
      <div class="scroll-area" id="scroll-area">
        <div class="conversation" id="conversation"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="composer-input" placeholder="Escribe tu pregunta…" rows="1"></textarea>
          <button id="composer-send" type="button">Enviar</button>
        </div>
        <div class="composer-hint">El contenido generado por la IA puede ser inexacto.</div>
      </div>
    </main>
  </div>
  <script src="/analyst_workspace.js" defer></script>
</body>
</html>

# Toesca Analyst Benchmark -- Rubric Judge, rubric content version 1.2.
#
# RUBRIC_VERSION lives in this file (see the constant near the bottom of
# judge.py that reads it) and is a DIFFERENT axis from:
#   - judge IMPLEMENTATION version (judge.py's own code: prompt assembly,
#     schema validation, retry policy, the tool_correctness deterministic
#     safety net -- see JUDGE_IMPL_VERSION in judge.py)
#   - judge MODEL/PROVIDER (e.g. mistral-large-latest via Mistral; passed
#     as a run-time parameter to run_judge(), never hardcoded here)
# A calibration result is only reproducible if all three are pinned
# together -- see eval/benchmark/results/judge_versioning_2026-08-13.md.
#
# Single source of truth for what each 0-4 score means. judge.py loads this
# file and renders it into the judge prompt verbatim -- editing the rubric
# means editing this file, not code.
#
# Every dimension is scored 0 (worst) - 4 (best), or marked not_applicable
# when the case genuinely doesn't call for it. See not_applicable_policy
# below -- v1.1 tightened this after calibration showed it being used as an
# escape hatch. The judge never invents its own scale.
#
# Deterministic graders (graders/gates.py, graders/deterministic.py) remain
# authoritative for anything they can verify -- these dimensions are the
# ones deliberately left unscored there because they require reading
# comprehension, not string/number matching. See design doc section 9.
#
# CHANGELOG
#   v1.1 (2026-08-13): first human calibration round (10 blind responses,
#   see eval/benchmark/results/human_vs_judge_v1_comparison_2026-08-13.md)
#   found systematic grade inflation -- judge scored >= human on every
#   comparable case, worst on a response the judge rated near-perfect that
#   a human caught fabricating a causal narrative. Root causes and the
#   general-principle fixes applied here (not case-specific patches):
#     1. not_applicable was following response_mode (clarified/declined)
#        rather than whether the dimension genuinely didn't apply --
#        added an explicit per-dimension policy below.
#     2. grounding/hallucination were reading fluency/confidence/structure
#        as evidence -- added an explicit non-evidence rule.
#     3. F1 under-fired on unsourced external citations and on a supported
#        fact silently transformed into a different, more specific,
#        unsupported fact -- both added as general F1 patterns.
#     4. tool_correctness was gated on tool_requirements being set and
#        implicitly rewarded query count -- decoupled from both.
#     5. analytical_quality had no explicit ceiling for "well-structured
#        but wrong driver" -- added a cap rule.
#     6. investigation_quality anchors implied quantity was the signal --
#        reworded around evidence coverage and identifier resolution.
#
#   v1.2 (2026-08-13): second calibration round (same 10 responses, see
#   eval/benchmark/results/human_vs_judge_v1_2_comparison_2026-08-13.md)
#   on top of a first surgical pass added: F1 retrieval-failure carve-out,
#   a C4 rewrite, clarification_judgment scoped to the initial decision,
#   and the tool_correctness N/A safety net. That pass fixed
#   not_applicable mismatches to zero and shrank divergences, but its C4
#   rewrite over-corrected: it started firing on properly hedged
#   hypotheses (2 new false positives on responses where the human
#   explicitly credited "podria" + an explicit evidence-gap
#   acknowledgment as legitimate hedging, not fabrication). This entry
#   narrows ONLY that regression -- everything else from the first
#   surgical pass (F1 carve-out, N/A semantics, clarification_judgment
#   isolation, tool_correctness safety net, grounding/hallucination
#   guidance) is unchanged. C4 now requires BOTH conditional framing AND
#   an explicit evidence-gap acknowledgment to be read as legitimate
#   hedging (not C4); it escalates back to C4 only when the causal claim
#   is stated as fact, or when the specific event the explanation depends
#   on is itself asserted without qualification, regardless of how
#   cautious the surrounding sentence sounds.
#
#   Known residual gap, not addressed by a rubric change: one response
#   (Strip Machalí divestment diagnosis, tae-l4-001/track_b) still shows
#   an F1 false negative across all three calibration rounds -- it
#   transforms `vigente_hasta` into an unestablished "lease wasn't
#   renewed" claim, exactly the fact-transformation pattern F1 already
#   describes with a near-identical conceptual example. Judged a
#   judge-MODEL prompt-following limitation candidate (mistral-large-latest
#   specifically), not a rubric gap -- the rule already exists in enough
#   detail that adding more case-shaped text risks overfitting to this one
#   response rather than fixing a real gap. Follow-up: re-run this same
#   calibration with a different judge model/provider (see
#   eval/benchmark/results/judge_versioning_2026-08-13.md) before
#   concluding the rubric itself needs another pass.

rubric_version: "1.2"

not_applicable_policy: >
  not_applicable is a claim about the DIMENSION, not about how the system
  responded. response_mode (answered / clarified / declined) is never by
  itself a reason to mark something not_applicable -- decide per dimension:
    - analytical_quality: not_applicable ONLY if clarifying/declining was
      itself the objectively correct call (the question was genuinely
      ambiguous or unanswerable from available data -- see
      clarification_judgment). If the task was answerable and the system
      avoided it anyway, score analytical_quality 0. Never not_applicable
      just because the response was short or was a clarifying question.
    - investigation_quality: same rule as analytical_quality. N/A only
      when clarifying/declining was correct; otherwise score it (0 if a
      real investigation was needed and none happened).
    - output_usefulness: always scorable on any non-empty response,
      including a clarification or a decline -- a clarifying question can
      itself be more or less useful (well-targeted vs. generic and
      redundant with what the user already said). Never not_applicable
      for visible text; empty text is model_non_answer territory, decided
      before the judge ever runs, not scored here at all.
    - hallucination: 4 is achievable, and IS the not_applicable-like case,
      for a response with no material factual claims -- score it 4
      ("nothing to hallucinate" is a real, good answer to "did it
      hallucinate", not an inapplicable question). Reserve not_applicable
      for hallucination only if the turn produced no evaluable text at
      all (which again should already be model_non_answer, not a judge
      call).
    - grounding: not_applicable only when the response contains literally
      zero factual claims to ground (e.g. a pure clarifying question with
      no assertions of any kind). One factual claim is enough to score it.
    - tool_correctness: see its own entry below -- no longer gated on
      tool_requirements.
    - clarification_judgment: always scorable; every turn has an implicit
      or explicit expectation about whether answering, clarifying, or
      declining was right.

dimensions:
  analytical_quality:
    question: >
      Does the response correctly identify what matters in the data and
      organize it into a coherent read of the situation?
    cap_rule: >
      HARD CEILING, checked before scoring: if the response's main driver,
      explanation, or conclusion contradicts the ground truth or the
      executed query results, analytical_quality cannot exceed 1 --
      regardless of how well-organized, detailed, or confident the writing
      is. Good structure wrapped around the wrong answer is not partial
      credit toward "good analysis"; it is exactly the failure mode this
      dimension exists to catch. Apply the cap first, then decide whether
      it's a 0 or a 1 using the anchors below.
    anchors:
      0: "No analysis attempted, or the response is unrelated to the question's analytical intent."
      1: "Restates raw data with no synthesis; fails to identify which facts are relevant to the question asked -- OR the response is well-organized but its main driver/conclusion contradicts ground truth (see cap_rule: this is a ceiling, not a floor, for that case)."
      2: "Identifies some relevant facts but the organization/reasoning is superficial, or misses an obvious driver/comparison the data itself supports."
      3: "Correctly identifies the main relevant facts and organizes them into a coherent read of the situation; minor gaps in depth or a secondary angle left unexplored."
      4: "Thorough: identifies the primary driver(s), addresses secondary factors, and the reasoning chain from data to conclusion is explicit and sound."

  grounding:
    question: >
      Is every substantive claim in the response traceable to a query the
      system actually executed, or to the provided ground truth?
    not_evidence: >
      Fluency, confidence, structure, level of detail, and professional
      tone are NOT evidence of grounding. A response can be well-written
      and completely ungrounded, or terse and fully grounded -- judge the
      traceability of each material claim to an executed query result,
      the provided ground truth, or a source explicitly available to the
      system, independent of how well it reads. When in doubt whether a
      claim is "traceable," check: does a specific row/value in
      query_results or ground_truth actually say this, or does the
      response just sound like it would know?
    anchors:
      0: "Central claims contradict the executed query results or the provided ground truth outright."
      1: "Most substantive claims are not traceable to any executed query or provided ground truth."
      2: "Some claims traceable, but at least one material claim lacks any query/ground-truth support."
      3: "Nearly all claims traceable to executed queries/ground truth; at most a minor unsupported aside."
      4: "Every substantive claim is directly traceable to an executed query result or the provided ground truth; no unsupported assertions."

  hallucination:
    question: >
      Does the response invent facts, entities, or relationships not
      grounded in evidence? (4 = none found; 0 = severe.) This dimension is
      NOT about wrong numbers pulled from a real, executed query -- that is
      C1/C2 territory, already scored deterministically. This is about
      claims that have no query/ground-truth basis at all. See "F1 vs
      C1/C2" below before scoring.
    not_evidence: >
      Same rule as grounding: fluency, confidence, structure, detail, and
      professional tone are NOT evidence of truthfulness. A confidently
      stated claim is not thereby a grounded one.
    scoring_a_response_with_no_material_claims: >
      A response that makes no material factual claims at all (e.g. it
      only asks a clarifying question) has nothing to hallucinate --
      score this 4, not not_applicable. Absence of unsupported claims is
      itself the thing this dimension measures.
    anchors:
      0: "Fabricates a material fact, entity, or relationship with no basis in any executed query or ground truth."
      1: "Contains a fabricated but non-material detail that doesn't change the substance of the answer."
      2: "Overstates confidence/certainty beyond what the evidence supports, without inventing new facts."
      3: "No fabrication; does not notably overstate certainty."
      4: "No fabrication, and explicit, correctly-calibrated acknowledgment of any evidence gaps (e.g. says plainly what it couldn't confirm) -- OR the response makes no material claims at all, so there is nothing to hallucinate."

  clarification_judgment:
    question: >
      Given what the case calls for (clarification_expected) and what data
      was actually available, was answering / clarifying / declining the
      right call, and was it justified?
    scope: >
      Judge ONLY the initial decision of whether to answer, clarify, or
      decline -- not what happened afterward. If the question was clear
      enough and available data made it answerable, and the system
      correctly chose to attempt an answer, that choice was right
      regardless of how the attempt then went. Do not lower
      clarification_judgment because of a wrong identifier, a failed
      retrieval, a wrong conclusion, or any other execution problem that
      happened after the decision to answer was already made -- those
      failures belong to analytical_quality, grounding, investigation_quality,
      tool_correctness, and the fatal/ceiling gates, not to this dimension.
      This dimension answers exactly one question: was attempting vs.
      clarifying vs. declining the right call at the moment the system
      decided which one to do.
    anchors:
      0: "Declines or asks for clarification when the data was clearly available and directly answerable (unjustified avoidance); OR answers directly when the question was genuinely ambiguous, silently picking one interpretation without flagging it."
      1: "Clarifies/declines with weak justification when a reasonable attempt was possible, or answers an ambiguous case without acknowledging the ambiguity existed."
      2: "The decision to answer/clarify/decline is defensible but not clearly the best choice available given the data."
      3: "The decision to answer/clarify/decline matches what the case calls for, with adequate justification."
      4: "The decision is exactly right and clearly justified -- e.g. correctly declines because the data genuinely doesn't exist and says so precisely, or correctly answers a well-specified question without unnecessary hedging."

  investigation_quality:
    question: >
      For questions that require exploration (comparisons, diagnosis,
      open-ended investigation): did the system find and cross-check the
      relevant evidence, correctly resolve the entities/identifiers it
      needed, and go deep where the data called for it?
    not_a_quantity_metric: >
      Number of tool calls is NOT a proxy for quality in either direction.
      One well-targeted query that finds the right evidence outscores five
      queries that miss it. A system that repeatedly queries with the
      wrong identifier/entity key and never corrects it should score LOW
      here even if it made many attempts -- persistence on a wrong
      identifier is a failure to investigate correctly, not effort that
      partially counts. Judge whether the right evidence was found and
      correctly resolved, not how many queries it took.
    anchors:
      0: "No investigation: concludes without querying anything the case requires, or the query attempts are entirely unrelated to the question, or every query uses a wrong/unresolved identifier so nothing relevant is ever actually found regardless of attempt count."
      1: "Minimal investigation: a single query where the question clearly needed comparison across entities/periods, OR repeated queries that never correctly resolve the entity/identifier needed."
      2: "Investigates but stops short of an obvious next step the data itself suggested (e.g. finds a discrepancy but never checks the adjacent period/entity that would explain it), or resolves identifiers correctly but doesn't cross-check findings against an available comparison."
      3: "Investigates adequately: finds and cross-checks the relevant evidence, correctly resolves the entities/identifiers the question requires, with reasonable efficiency."
      4: "Thorough and efficient: covers every angle the question needs, correctly resolves all identifiers on the first attempt or self-corrects promptly, follows up on what the data reveals, without redundant or pointless queries."

  output_usefulness:
    question: >
      Would a human analyst find this response usable as-is, or close to it?
    anchors:
      0: "Not usable: wrong, irrelevant, or too vague to act on."
      1: "Marginally usable: requires substantial rework or independent verification before an analyst could use it."
      2: "Usable with moderate editing: the core content is right but poorly organized or missing an obvious bottom line."
      3: "Usable with minor polish: clear bottom line, correctly organized, an analyst could forward it with light editing."
      4: "Directly usable: clear bottom line, appropriately organized, and anticipates the natural follow-up question."

  tool_correctness:
    question: >
      Were the tool calls the system actually made -- table/view choice,
      field/column choice, identifier resolution, and interpretation of
      what came back -- correct and reasonably efficient? This applies
      WHENEVER the response contains any tool calls, regardless of
      whether the case's tool_requirements field is set (that field only
      drives the deterministic count/table checks in
      graders/deterministic.py -- it is not a gate on this dimension).
    when_not_applicable: >
      not_applicable only when there were no tool calls AND none were
      genuinely needed to answer correctly (e.g. the answer follows
      directly from ground truth already given, or the question doesn't
      require querying anything). If no tool calls were made but the
      question genuinely required querying data to answer correctly,
      that is not not_applicable -- score it 0.
    not_a_quantity_metric: >
      Do not reward number of queries. A single correctly-targeted query
      beats many. A system that insists on a wrong table, field, or
      identifier across multiple calls -- without ever correcting course
      -- must score low, not get partial credit for the volume of effort.
    anchors:
      0: "No tool calls were made despite the question genuinely requiring them to answer correctly -- OR the queries run are unrelated to what's needed, or persistently use a wrong table/field/identifier without ever correcting it."
      1: "Queries are on-topic but use the wrong grain/filter/identifier such that the results couldn't support the required facts even in principle."
      2: "Queries are roughly right (correct tables/identifiers) but inefficient, redundant, or the results are misinterpreted once resolved."
      3: "Queries are well-targeted, identifiers correctly resolved, results correctly interpreted, with at most minor inefficiency."
      4: "Queries are precisely targeted, identifiers correctly resolved on the first attempt, minimal, and sufficient to support the answer, with results interpreted correctly."

# ---------------------------------------------------------------------------
# Gates the judge decides (F1, C4, C5). F2/F3/F4/F5/C1/C2/C3 are fully
# deterministic (graders/gates.py) and are NEVER re-decided here -- the
# judge is not shown them as open questions, only as prior results (see
# judge_input.py) so it doesn't waste a verdict on already-settled ground.
# ---------------------------------------------------------------------------
gates:
  F1_fabrication:
    kind: fatal
    definition: >
      Reserved for MATERIAL fabrication: asserting as fact an entity,
      relationship, event, or data point that is not supported by any
      executed query result or the provided ground truth, where the claim
      is not simply a numeric value pulled from a real query and reported
      inaccurately. Two patterns beyond an outright invented data point
      also count, both general principles, not tied to any one case:
        (a) External-source attribution without access to that source.
            A material claim attributed to an outside source the system
            never queried or was never given -- "segun Source X, el
            benchmark es Y" -- is F1 even though it names a source,
            because naming a source does not make the claim verifiable
            from anything the system actually has. This does NOT cover
            the system correctly citing something it WAS given (its own
            ground truth, its own query results, or context explicitly
            provided to it) -- only claims attributed to something
            outside what it consulted or received.
        (b) Fact transformation: taking a real, supported fact and
            silently turning it into a different, more specific fact that
            the original does not actually establish. General shape: data
            point P is confirmed by a query; the response asserts a more
            specific claim Q that would explain or follow from P, without
            P actually entailing Q. Conceptual example: a query confirms
            an asset stopped being active as of a given date; that does
            NOT by itself establish WHY (e.g. that a lease ended and
            wasn't renewed) -- asserting the more specific unestablished
            reason as fact is F1, even though the underlying date is real.
    explicitly_not_f1: >
      A number that came from an executed query but is wrong, mis-rounded,
      or from the wrong period/entity is C1/C2 territory (already scored
      deterministically) -- do NOT trigger F1 for that. F1 requires that
      the underlying claim itself (not just its numeric value) has no
      grounding in anything actually queried or given as ground truth.
      General knowledge or a hypothesis explicitly presented as such
      ("una posible explicacion seria...", "podria deberse a...") is not
      F1 either -- do not convert every hypothesis or piece of background
      knowledge into fabrication. The line is whether the claim is
      presented AS VERIFIED FACT: a qualified hypothesis is not; an
      unqualified assertion sourced to nothing the system has is.
      Retrieval failure is also NOT F1: a query built on a wrong
      identifier/table/filter that returns zero rows, after which the
      system concludes (correctly or not) that no data exists, is a tool
      or investigation failure, not fabrication -- nothing was invented,
      the retrieval itself just failed. Score that through
      tool_correctness (wrong identifier/query), grounding (claim not
      actually checked against the right data), investigation_quality
      (didn't find or didn't cross-check the real evidence), and
      analytical_quality (wrong conclusion) as applicable -- do not also
      reach for F1 unless the response goes further and asserts a
      specific invented fact beyond "I found nothing."
    trigger_test: >
      Ask: "if I strip out every number, is there still a claim here that
      no executed query or ground truth fact supports, presented as if it
      were verified rather than hypothesized?" If yes -> F1 triggered. If
      the ungrounded part is only the wrong number, or the claim is
      explicitly flagged as an unconfirmed hypothesis, it is not F1. If
      the response's failure is that a wrong query returned nothing and it
      said so, that is retrieval failure, not F1 -- see explicitly_not_f1.

  C4_unsupported_causality:
    kind: ceiling
    definition: >
      Do not trigger C4 merely because causal LANGUAGE is present ("porque",
      "debido a", "explica", "causo") -- judge the epistemic commitment
      level of the claim, not its vocabulary. Two shapes to tell apart:
        - Unsupported causal conclusion: the response commits to a causal relationship between X and Y
          as settled fact, without evidence
          for the causal link itself (correlation/co-occurrence in the
          data is not causal evidence unless the case's ground truth
          establishes the mechanism). -> C4.
        - Explicitly qualified hypothesis: language such as "podria",
          "una posible explicacion seria", "si X..." COMBINED WITH an
          explicit acknowledgment that the evidence is insufficient to
          confirm it ("pero no tenemos evidencia suficiente para
          confirmarlo", "no puedo confirmarlo con los datos disponibles").
          When BOTH the conditional framing AND the evidence-gap
          acknowledgment are present, that is NOT C4 by itself, full stop
          -- this is exactly the calibrated behavior several cases expect,
          and conditional wording alone is not license to override it.
      C4 is reserved for causality presented as an established fact, or
      for an explanation whose core support is a specific event/fact that
      the response asserts as though it happened -- states matter-of-factly,
      without any hedge or evidence-gap acknowledgment attached to THAT
      event -- even if the overall causal conclusion built on top of it
      carries some cautious wording elsewhere. The test is whether the
      foundational event itself is qualified, not whether the sentence
      around it sounds tentative.
    explicitly_not_c4: >
      A genuinely hedged hypothesis -- both conditionally framed AND
      explicitly flagging insufficient evidence -- is NOT C4 on its own --
      do not let the mere presence of an inferred or uncertain event
      override that combined signal. Reserve C4 for when the event
      underlying the explanation is itself asserted without any such
      qualification (stated as fact), or when the causal claim as a whole
      is presented as confirmed.
    trigger_test: >
      Ask: does the response present the causal claim AS ESTABLISHED FACT,
      with no hedge and no acknowledgment that evidence is insufficient?
      -> C4. If it hedges the causal claim AND explicitly says the
      evidence isn't sufficient to confirm it, that combination is NOT C4,
      regardless of whether an unproven event is mentioned along the way.
      Only escalate to C4 despite hedging if the specific event the
      explanation depends on is itself stated as fact, unqualified, even
      though the surrounding causal conclusion sounds cautious.

  C5_forbidden_claim:
    kind: ceiling
    definition: >
      The case author listed specific claims in `forbidden_claims` that
      must not appear in the response. Evaluate each listed claim
      literally against the response text: did the response make that
      specific claim (or a clear paraphrase of it), yes or no. This is not
      a general hallucination check -- only the claims the case explicitly
      lists apply here.
    explicitly_not_c5: >
      A claim that is merely *similar in topic* to a forbidden_claims entry
      but does not actually assert it is NOT a violation -- e.g. discussing
      vacancy trends is not itself "attributing the swing to a specific
      tenant" unless it actually names one without evidence. Judge the
      literal claim, not the general subject area.
    trigger_test: >
      For each entry in forbidden_claims: does the response text assert
      that specific thing (or an unmistakable paraphrase)? If yes for any
      entry -> C5 triggered, citing which entry and the matching text.

    sql: "SELECT valor FROM derived_kpi WHERE kpi = 'vacancia_pct' AND entidad_key = 'TRI' AND periodo = '2026-06'"
    unit: pct
  vacancia_tri_2026_05:
    sql: "SELECT valor FROM derived_kpi WHERE kpi = 'vacancia_pct' AND entidad_key = 'TRI' AND periodo = '2026-05'"

# Toesca Analyst Benchmark v1 — Holdout governance manifest (minimized)
#
# Correccion post Batch-1-review: la version anterior de este archivo
# contenia metadata semantica case-level (entidad, periodo, metrica,
# tablas fuente, primary/secondary behavior, similarity_reason contra
# Dev). Eso es exactamente el tipo de contenido que este repo NO debe
# tener disponible por defecto para agentes de desarrollo -- moverlo aqui
# derrotaba parcialmente el aislamiento fisico descrito en
# cases/holdout/README.md. Esa informacion completa vive ahora
# UNICAMENTE en el repo privado
# (toesca-benchmark-holdout-private/MANIFEST_FULL.yaml), junto al
# contenido real de los casos.
#
# Este archivo solo registra lo minimo necesario para gobernanza: cuantos
# casos existen, en que batch, en que nivel/categoria estructural (L1-L8 /
# TAE-TCE, no el dominio de negocio que evaluan) y su estado de revision.
# No permite reconstruir de que trata ningun caso.
#
# `status`: draft (escrito, no revisado) | reviewed (paso human review del
# batch) | frozen (incluido en HOLDOUT_FREEZE_MANIFEST.yaml).
#
# `tests/test_holdout_not_leaked.py` falla si aparece cualquier campo
# fuera de {case_id, split, level, category, status, batch} en una fila
# de `cases`, o si aparece un campo de la lista negra explicita
# (entities, periods, metrics, source_tables, primary_behavior,
# secondary_behaviors, similarity_reason, domain, dev_case_checked_against,
# most_similar_dev_case) en cualquier parte de este archivo.


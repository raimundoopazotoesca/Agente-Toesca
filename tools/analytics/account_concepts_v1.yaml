      - {code: INMOSA_ADM, concept_id: administration_fees, sign_rule: expense_magnitude, unit: UF, amount_field: monto_clp, status: mapped}
      - {code: 3-1-10-102, concept_id: administration_fees, sign_rule: expense_magnitude, unit: clp, amount_field: monto_clp, status: mapped}
      - {code: 3-1-10-105, concept_id: administration_fees, sign_rule: expense_magnitude, unit: clp, amount_field: monto_clp, status: mapped}
